<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horaires de Prière - Salé</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border-top: 6px solid #2c3e50; text-align: center; }
        h1 { color: #2c3e50; font-size: 20px; margin: 0; }
        .location { font-size: 14px; color: #888; margin-bottom: 15px; }
        .countdown-container { background: linear-gradient(135deg, #2c3e50, #34495e); padding: 20px; border-radius: 16px; margin-bottom: 20px; color: white; }
        .countdown-time { font-size: 40px; font-weight: 800; margin: 5px 0; }
        .prayer-list { list-style: none; padding: 0; margin: 0; text-align: left; }
        .prayer-item { display: flex; justify-content: space-between; padding: 14px; border-radius: 10px; margin-bottom: 5px; transition: 0.3s; }
        .active { background-color: #ecf0f1; color: #2c3e50; font-weight: bold; border-left: 4px solid #2c3e50; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 id="hijri-title">Chargement...</h1>
        <div class="location">Rabat - Salé (GMT+1)</div>
        <div id="display-date" style="font-weight: bold; margin-bottom: 15px;"></div>
        <div class="countdown-container">
            <div id="next-prayer-name">Initialisation...</div>
            <div class="countdown-time" id="countdown">00:00:00</div>
        </div>
        <ul class="prayer-list" id="prayer-list"></ul>
    </div>

            "2026-05-24": { "h": 7, "Sobh": "04:34", "Chourouq": "06:17", "Dohr": "13:29", "Asr": "17:09", "Maghrib": "20:32", "Icha": "22:12" },
            "2026-05-25": { "h": 8, "Sobh": "04:33", "Chourouq": "06:17", "Dohr": "13:29", "Asr": "17:10", "Maghrib": "20:33", "Icha": "22:13" },

            "2026-05-27": { "h": 10, "Sobh": "04:31", "Chourouq": "06:16", "Dohr": "13:30", "Asr": "17:10", "Maghrib": "20:35", "Icha": "22:15" },
            "2026-05-28": { "h": 11, "Sobh": "04:31", "Chourouq": "06:16", "Dohr": "13:30", "Asr": "17:10", "Maghrib": "20:35", "Icha": "22:16" },

            "2026-05-30": { "h": 13, "Sobh": "04:29", "Chourouq": "06:15", "Dohr": "13:30", "Asr": "17:10", "Maghrib": "20:36", "Icha": "22:17" },

            "2026-06-03": { "h": 17, "Sobh": "04:27", "Chourouq": "06:14", "Dohr": "13:31", "Asr": "17:11", "Maghrib": "20:39", "Icha": "22:21" },
            "2026-06-04": { "h": 18, "Sobh": "04:26", "Chourouq": "06:13", "Dohr": "13:31", "Asr": "17:11", "Maghrib": "20:39", "Icha": "22:21" },
            "2026-06-05": { "h": 19, "Sobh": "04:26", "Chourouq": "06:13", "Dohr": "13:31", "Asr": "17:11", "Maghrib": "20:40", "Icha": "22:22" },
            "2026-06-06": { "h": 20, "Sobh": "04:26", "Chourouq": "06:13", "Dohr": "13:31", "Asr": "17:11", "Maghrib": "20:40", "Icha": "22:23" },
            "2026-06-07": { "h": 21, "Sobh": "04:25", "Chourouq": "06:13", "Dohr": "13:31", "Asr": "17:12", "Maghrib": "20:41", "Icha": "22:24" },
            "2026-06-08": { "h": 22, "Sobh": "04:25", "Chourouq": "06:13", "Dohr": "13:31", "Asr": "17:12", "Maghrib": "20:41", "Icha": "22:24" },
            "2026-06-09": { "h": 23, "Sobh": "04:25", "Chourouq": "06:13", "Dohr": "13:32", "Asr": "17:12", "Maghrib": "20:42", "Icha": "22:25" },
            "2026-06-10": { "h": 24, "Sobh": "04:24", "Chourouq": "06:12", "Dohr": "13:32", "Asr": "17:12", "Maghrib": "20:42", "Icha": "22:25" },
            "2026-06-11": { "h": 25, "Sobh": "04:24", "Chourouq": "06:12", "Dohr": "13:32", "Asr": "17:12", "Maghrib": "20:43", "Icha": "22:26" },
            "2026-06-12": { "h": 26, "Sobh": "04:24", "Chourouq": "06:12", "Dohr": "13:32", "Asr": "17:12", "Maghrib": "20:43", "Icha": "22:27" },
            "2026-06-13": { "h": 27, "Sobh": "04:24", "Chourouq": "06:12", "Dohr": "13:33", "Asr": "17:13", "Maghrib": "20:44", "Icha": "22:27" },
            "2026-06-14": { "h": 28, "Sobh": "04:24", "Chourouq": "06:12", "Dohr": "13:33", "Asr": "17:13", "Maghrib": "20:44", "Icha": "22:27" },
            "2026-06-15": { "h": 29, "Sobh": "04:24", "Chourouq": "06:13", "Dohr": "13:33", "Asr": "17:13", "Maghrib": "20:44", "Icha": "22:28" },
            "2026-06-16": { "h": 30, "Sobh": "04:24", "Chourouq": "06:13", "Dohr": "13:33", "Asr": "17:14", "Maghrib": "20:45", "Icha": "22:28" }
        };

        function update() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayKey = `${year}-${month}-${day}`;

            const data = prayerData[todayKey];
            
            if(!data) {
                document.getElementById('hijri-title').innerText = "Fin de calendrier";
                return;
            }

            document.getElementById('hijri-title').innerText = `✨ ${data.h} Dhou al-Hijja 1447`;
            document.getElementById('display-date').innerText = now.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

            const prayers = ["Sobh", "Chourouq", "Dohr", "Asr", "Maghrib", "Icha"];
            let nextP = null;
            let nextT = null;

            for (const name of prayers) {
                const [h, m] = data[name].split(':');
                const pDate = new Date(now);
                pDate.setHours(parseInt(h), parseInt(m), 0, 0);

                if (pDate > now) {
                    nextP = name;
                    nextT = pDate;
                    break;
                }
            }

            if (!nextT) {
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomYear = tomorrow.getFullYear();
                const tomMonth = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const tomDay = String(tomorrow.getDate()).padStart(2, '0');
                const tomorrowKey = `${tomYear}-${tomMonth}-${tomDay}`;
                
                const tomData = prayerData[tomorrowKey];
                if (tomData) {
                    const [h, m] = tomData["Sobh"].split(':');
                    nextT = new Date(tomorrow);
                    nextT.setHours(parseInt(h), parseInt(m), 0, 0);
                    nextP = "Sobh (Demain)";
                }
            }

            const list = document.getElementById('prayer-list');
            list.innerHTML = '';
            prayers.forEach(name => {
                const li = document.createElement('li');
                li.className = 'prayer-item' + (nextP === name ? ' active' : '');
                li.innerHTML = `<span>${name}</span><span>${data[name]}</span>`;
                list.appendChild(li);
            });

            if (nextT) {
                document.getElementById('next-prayer-name').innerText = `Prochaine : ${nextP}`;
                const diff = nextT - now;
                const hh = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const mm = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const ss = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('countdown').innerText = `${hh}:${mm}:${ss}`;
            }
        }

        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
